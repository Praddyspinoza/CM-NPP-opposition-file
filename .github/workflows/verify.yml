name: Verify refresh changes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/update.py
      - run: python -m unittest discover -s tests -v
      - run: node --test ops/refresh-dispatch-worker/index.test.mjs
